name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  # CI_RUNS_ON (an org variable) moves this to self-hosted runners; unset,
  # it stays on GitHub's.
  go:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          cache: ${{ !vars.CI_RUNS_ON }}
          go-version-file: go.mod
      - name: Formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v9
      - name: Schemas are valid JSON
        run: for f in schema/*.json; do python3 -m json.tool "$f" > /dev/null; done
  # Docker builds run where TRUSTED_RUNS_ON says: the home runners once
  # they have Docker, GitHub's until then.
  docker:
    runs-on: ${{ fromJSON(vars.TRUSTED_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t toskar-ratings:ci .
      - name: The image starts and answers
        # The home runners share one Docker daemon, so each run takes its own
        # container name and a free host port, and removes the container after.
        run: |
          name="ratings-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$name" -p 127.0.0.1::8080 -e RATINGS_SECRET=ci-secret-ci-secret-ci-secret-ci toskar-ratings:ci
          port="$(docker port "$name" 8080/tcp | head -n1 | sed 's/.*://')"
          for i in $(seq 1 20); do curl -sf "localhost:$port/healthz" && exit 0; sleep 1; done
          docker logs "$name"; exit 1
