# RATINGS_SECRET and RATINGS_ADMIN_TOKEN come from AWS SSM Parameter Store
# through External Secrets, so a copy lives outside the cluster.
# RATINGS_SECRET must never change: it keys the stored client hashes.
# The namespace needs a SecretStore named aws-ssm (see docs/deploy.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: yggdrasil-ratings
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-ssm
  target:
    name: yggdrasil-ratings
    # Keep the Secret if the ExternalSecret is ever removed.
    deletionPolicy: Retain
  data:
    - secretKey: RATINGS_SECRET
      remoteRef:
        key: /yggdrasil-ratings/prod/RATINGS_SECRET
    - secretKey: RATINGS_ADMIN_TOKEN
      remoteRef:
        key: /yggdrasil-ratings/prod/RATINGS_ADMIN_TOKEN
