apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: toskar-ratings
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # The service refuses bodies over 16 KB itself; stop larger ones here.
    nginx.ingress.kubernetes.io/proxy-body-size: 64k
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ratings.toskar.ai
      secretName: toskar-ratings-tls
  rules:
    - host: ratings.toskar.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: toskar-ratings
                port:
                  name: http
