# Lets the ExternalSecret read SSM Parameter Store, like the other apps on
# this cluster. The aws-credentials Secret it names is created by hand
# once (docs/deploy.md), so the key never sits in git.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-ssm
spec:
  provider:
    aws:
      service: ParameterStore
      region: us-east-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-credentials
            key: access-key-id
          secretAccessKeySecretRef:
            name: aws-credentials
            key: secret-access-key
